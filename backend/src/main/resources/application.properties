spring.datasource.url=jdbc:mysql://localhost:3306/electronics_store
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Lazy-зв'язки читаємо лише всередині транзакцій (у сервісах)
spring.jpa.open-in-view=false
# Максимальний розмір сторінки в каталозі
spring.data.web.pageable.max-page-size=50

# JWT: секрет у Base64 (мінімум 32 байти). На сервері задається змінною середовища JWT_SECRET
app.jwt.secret=${JWT_SECRET:ZWxlY3Ryb25pY3Mtc3RvcmUtZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLTIwMjY=}
app.jwt.expiration-minutes=1440
# Адреса фронтенду (Vite dev-сервер)
app.cors.allowed-origins=http://localhost:5173

# Local secrets (password) live in application-secret.properties, which is not committed to git
spring.config.import=optional:classpath:application-secret.properties
